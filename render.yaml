services:
  - type: web
    name: 3mk-phishing-detector
    runtime: python
    plan: free
    buildCommand: pip install -r backend1/requirements-deploy.txt
    startCommand: gunicorn --chdir backend1 backend.app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
